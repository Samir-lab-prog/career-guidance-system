<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Career Guidance System</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

<header>
    <h1>Career Guidance System</h1>
    <p>Administrator Login</p>
</header>

<div class="login-container">

    <div class="login-box admin-login-box">

        <h2>Admin Login</h2>

        <p class="login-subtitle">
            Login to manage the Career Guidance System
        </p>

        <form action="admin-dashboard.html">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter admin username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter admin password"
                required
            >

            <button type="submit">
                Admin Login
            </button>

        </form>

        <p class="register-text">
            <a href="index.html">← Back</a>
        </p>

    </div>

</div>

<footer>
    <p>&copy; 2026 Career Guidance System | All Rights Reserved</p>
</footer>

</body>
</html>
