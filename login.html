<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Career Guidance System</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

<header>

    <h1>Career Guidance System</h1>

    <p>Your Path to a Bright Future</p>

</header>


<div class="login-container">

    <!-- USER LOGIN -->

    <div class="login-box">

        <h2>User Login</h2>

        <p class="login-subtitle">
            Login to continue your career journey
        </p>

        <form action="home.html">

            <label for="user-email">
                Email Address
            </label>

            <input
                type="email"
                id="user-email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="user-password">
                Password
            </label>

            <input
                type="password"
                id="user-password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                User Login
            </button>

        </form>


        <p class="register-text">

            Don't have an account?

            <a href="register.html">
                Register Now
            </a>

        </p>

    </div>


    <!-- ADMIN LOGIN -->

    <div class="login-box admin-box">

        <h2>Admin Login</h2>

        <p class="login-subtitle">
            Login to manage the system
        </p>

        <form action="admin-dashboard.html">

            <label for="admin-username">
                Username
            </label>

            <input
                type="text"
                id="admin-username"
                name="username"
                placeholder="Enter admin username"
                required
            >


            <label for="admin-password">
                Password
            </label>

            <input
                type="password"
                id="admin-password"
                name="password"
                placeholder="Enter admin password"
                required
            >


            <button type="submit">
                Admin Login
            </button>

        </form>


        <p class="register-text">

            <a href="home.html">
                ← Back to Home
            </a>

        </p>

    </div>

</div>


<footer>

    <p>
        &copy; 2026 Career Guidance System | All Rights Reserved
    </p>

</footer>

</body>

</html>
