```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Login - Career Guidance System</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

<header>
    <h1>Career Guidance System</h1>
    <p>Your Path to a Bright Future</p>
</header>


<div class="login-container">

    <div class="login-box">

        <h2>User Login</h2>

        <p class="login-subtitle">
            Login to continue your career journey
        </p>


        <form action="php/login.php" method="POST">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p class="register-text">
            Don't have an account?
            <a href="register.html">Register Now</a>
        </p>


        <p class="register-text">
            <a href="index.html">← Back</a>
        </p>

    </div>

</div>


<footer>
    <p>&copy; 2026 Career Guidance System | All Rights Reserved</p>
</footer>

</body>

</html>
