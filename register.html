<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Career Guidance System</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

<header>
    <h1>Career Guidance System</h1>
    <p>Your Path to a Bright Future</p>
</header>


<div class="login-container">

    <div class="login-box">

        <h2>Create Account</h2>

        <p class="login-subtitle">
            Register to start your career journey
        </p>


        <form action="home.html" onsubmit="return validateRegisterForm(this)">

            <!-- Full Name -->
            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >


            <!-- Email -->
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <!-- Password -->
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <!-- Confirm Password -->
            <label for="confirm-password">Confirm Password</label>

            <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                placeholder="Confirm your password"
                required
            >


            <button type="submit">
                Register
            </button>

        </form>


        <!-- Login Link -->
        <p class="register-text">
            Already have an account?
            <a href="login.html">Login</a>
        </p>


        <!-- Back Link -->
        <p class="register-text">
            <a href="home.html">← Back</a>
        </p>

    </div>

</div>


<footer>
    <p>
        &copy; 2026 Career Guidance System | All Rights Reserved
    </p>
</footer>


<script src="js/main.js"></script>

</body>
</html>
